# SonarCloud Configuration for Agora
sonar.projectKey=anyulled_agora
sonar.organization=anyulled

# Source & Test paths
sonar.sources=apps,packages,infrastructure
sonar.tests=tests,apps,packages
sonar.test.inclusions=tests/**,apps/**/__tests__/**,packages/**/__tests__/**

# Analysis exclusions
sonar.exclusions=node_modules/**,dist/**,coverage/**,harness/**,docs/**,**/*.test.ts,**/*.spec.ts,**/*.d.ts,**/*.d.mts
sonar.test.exclusions=node_modules/**,dist/**,coverage/**,harness/**,docs/**

# Duplication (CPD) exclusions: tests, harness scripts, documentation, and SQL migrations/schemas
sonar.cpd.exclusions=tests/**,apps/**/__tests__/**,packages/**/__tests__/**,infrastructure/cloudflare/migrations/**,infrastructure/cloudflare/schema.sql,harness/**,docs/**
