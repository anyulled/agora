<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agora Admin — Presentation Management</title>
    <style>
      :root {
        --color-bg: #0f172a;
        --color-surface: #1e293b;
        --color-border: #334155;
        --color-text: #f8fafc;
        --color-muted: #94a3b8;
        --color-primary: #3b82f6;
        --color-danger: #ef4444;
        --color-success: #10b981;
        --color-warning: #f59e0b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-bg);
        color: var(--color-text);
        min-height: 100vh;
      }
      header {
        background-color: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
        padding: 1rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      main {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
      }
      .button-group {
        display: flex;
        gap: 0.5rem;
      }
      button {
        cursor: pointer;
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: 1px solid transparent;
        font-weight: 500;
        font-size: 0.875rem;
      }
      .btn-primary { background: var(--color-primary); color: white; }
      .btn-danger { background: var(--color-danger); color: white; }
      .btn-secondary { background: var(--color-border); color: var(--color-text); }
      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .modal-content {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 8px;
        padding: 2rem;
        max-width: 500px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="admin-root">
      <header>
        <h1>Agora Admin</h1>
        <div id="admin-actions"></div>
      </header>
      <main id="admin-main">
        <section id="dashboard-section" aria-label="Presentations Dashboard"></section>
        <section id="workflow-section" aria-label="Slide Images Workflow"></section>
        <section id="preview-section" aria-label="Asset Preview"></section>
      </main>
      <div id="modal-container"></div>
    </div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
