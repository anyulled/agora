<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agora Audience Companion</title>
    <style>
      :root {
        --color-bg: #0b0f19;
        --color-surface: #151d30;
        --color-surface-hover: #1e293b;
        --color-border: #2d3748;
        --color-text: #f1f5f9;
        --color-muted: #94a3b8;
        --color-primary: #3b82f6;
        --color-primary-hover: #2563eb;
        --color-accent: #8b5cf6;
        --color-danger: #ef4444;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--color-bg);
        color: var(--color-text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        background-color: var(--color-surface);
        border-bottom: 1px solid var(--color-border);
        padding: 0.75rem 1.25rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 10;
      }
      main {
        flex: 1;
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      .card {
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 12px;
        padding: 1.25rem;
      }
      .button-group {
        display: flex;
        gap: 0.5rem;
      }
      button {
        cursor: pointer;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        border: 1px solid transparent;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.15s ease-in-out;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .reactions-bar {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.5rem;
      }
      .reaction-btn {
        background: var(--color-surface-hover);
        color: var(--color-text);
        font-size: 1.5rem;
        padding: 0.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .reaction-count {
        font-size: 0.75rem;
        font-weight: normal;
        color: var(--color-muted);
      }
      .qa-section textarea {
        width: 100%;
        padding: 0.75rem;
        background: #0b0f19;
        border: 1px solid var(--color-border);
        border-radius: 8px;
        color: var(--color-text);
        resize: vertical;
        min-height: 80px;
      }
      .question-item {
        border-bottom: 1px solid var(--color-border);
        padding: 0.75rem 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="audience-root"></div>
    <script type="module" src="./src/index.ts"></script>
  </body>
</html>
